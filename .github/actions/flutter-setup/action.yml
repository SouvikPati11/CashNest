name: "Flutter setup"
description: "Install Java 17 and Flutter (stable) with caching, then fetch pub dependencies for mobile/."

runs:
  using: "composite"
  steps:
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Set up Flutter (stable)
      uses: subosito/flutter-action@v2
      with:
        channel: "stable"
        cache: true

    - name: Show tool versions
      shell: bash
      run: |
        flutter --version
        java -version

    - name: Fetch pub dependencies
      shell: bash
      working-directory: mobile
      run: flutter pub get
