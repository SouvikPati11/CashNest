name: CI

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
    paths:
      - "mobile/**"
      - ".github/**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "mobile/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to build on demand"
        type: choice
        options:
          - dev
          - staging
          - production
        default: production

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: ./.github/actions/flutter-setup

      - name: Verify formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

  test:
    name: Flutter test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: ./.github/actions/flutter-setup

      - name: Run tests
        working-directory: mobile
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build ${{ matrix.flavor }} (APK + AAB)
    needs: [analyze, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: dev
            app_env: development
          - flavor: staging
            app_env: staging
          - flavor: production
            app_env: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: ./.github/actions/flutter-setup

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle', 'mobile/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare Android build
        uses: ./.github/actions/android-prepare
        with:
          keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          store_password: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: Build APK (release)
        working-directory: mobile
        run: >-
          flutter build apk --release
          --flavor ${{ matrix.flavor }}
          --dart-define=APP_ENV=${{ matrix.app_env }}

      - name: Build App Bundle (release)
        working-directory: mobile
        run: >-
          flutter build appbundle --release
          --flavor ${{ matrix.flavor }}
          --dart-define=APP_ENV=${{ matrix.app_env }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashnest-${{ matrix.flavor }}-apk
          path: mobile/build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: cashnest-${{ matrix.flavor }}-aab
          path: mobile/build/app/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab
          if-no-files-found: error
          retention-days: 14
