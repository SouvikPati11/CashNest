name: cashnest
description: CashNest — Rewards & Earning platform (Flutter foundation).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Authentication
  google_sign_in: ^6.2.1

  # Networking
  dio: ^5.7.0

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Diagnostics & platform
  logger: ^2.4.0
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3

  # i18n
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Release tooling (run explicitly; not part of the app build)
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

# ── App icon generation (task 3) ─────────────────────────────────────────────
# Add the source PNGs under assets/branding/ then run:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#0B6E4F"
    theme_color: "#0B6E4F"
  adaptive_icon_background: "#0B6E4F"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

# ── Native splash generation (task 4) ────────────────────────────────────────
# After editing, run:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B6E4F"
  image: "assets/branding/splash_logo.png"
  color_dark: "#0B1B14"
  image_dark: "assets/branding/splash_logo.png"
  android_12:
    color: "#0B6E4F"
    image: "assets/branding/splash_logo.png"
    color_dark: "#0B1B14"
    image_dark: "assets/branding/splash_logo.png"
  android: true
  ios: true
  web: false
  fullscreen: true
