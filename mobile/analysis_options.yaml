include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
    # StateNotifier.debugState is the public accessor used to read a
    # controller's state directly in unit tests; it is deprecated upstream but
    # has no non-protected replacement, so keep it as a non-fatal, ignored info.
    deprecated_member_use: ignore
    # Style-only lints kept non-fatal so they don't gate CI.
    prefer_const_constructors: ignore
    prefer_function_declarations_over_variables: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/localization/l10n/**"

linter:
  rules:
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - use_key_in_widget_constructors
